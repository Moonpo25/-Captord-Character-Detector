
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Arabic OCR data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata" \
            -o app/src/main/assets/tessdata/ara.traineddata
          test -s app/src/main/assets/tessdata/ara.traineddata

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Captord-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
